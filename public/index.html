<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tyrion turns long links into short, private ones.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1017" media="(prefers-color-scheme: dark)">
  <title>Tyrion</title>
  <style>
    :root {
      --bg: #f4f5f9;
      --card: #ffffff;
      --text: #14161f;
      --muted: #646b7a;
      --line: #e3e6ee;
      --field: #f8f9fc;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef0ff;
      --accent-text: #3730a3;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --ok: #15803d;
      --ok-soft: #f0fdf4;
      --glow-a: rgba(79, 70, 229, .18);
      --glow-b: rgba(236, 72, 153, .12);
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 24px 60px -24px rgba(20, 22, 31, .28), 0 1px 0 rgba(255, 255, 255, .6) inset;
      --ring: 0 0 0 4px rgba(79, 70, 229, .18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1017;
        --card: #161925;
        --text: #eef0f6;
        --muted: #9aa2b5;
        --line: #262a38;
        --field: #0f1219;
        --accent: #7c74ff;
        --accent-hover: #9089ff;
        --accent-soft: #1f1e3d;
        --accent-text: #c7c3ff;
        --danger: #f87171;
        --danger-soft: #2a1516;
        --ok: #4ade80;
        --ok-soft: #10261a;
        --glow-a: rgba(124, 116, 255, .22);
        --glow-b: rgba(236, 72, 153, .14);
        --shadow: 0 24px 60px -24px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .04) inset;
        --ring: 0 0 0 4px rgba(124, 116, 255, .28);
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(24px, 6vh, 72px) 20px 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background:
        radial-gradient(60vw 60vw at 10% -10%, var(--glow-a), transparent 60%),
        radial-gradient(50vw 50vw at 100% 110%, var(--glow-b), transparent 60%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent-text); }

    .wrap { width: 100%; max-width: 640px; }

    header { text-align: center; margin-bottom: 24px; }
    .logo {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.6rem; letter-spacing: -.02em; text-decoration: none; color: var(--text);
    }
    .logo svg { width: 30px; height: 30px; }
    .tagline { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 32px);
      animation: rise .5s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

    label { display: block; font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

    .field { position: relative; }
    .field input {
      width: 100%; height: 54px;
      padding: 0 52px 0 16px;
      font: inherit; font-size: 1rem;
      color: var(--text);
      background: var(--field);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .field input::placeholder { color: var(--muted); opacity: .7; }
    .field input:focus { border-color: var(--accent); box-shadow: var(--ring); background: var(--card); }
    .field input[aria-invalid="true"] { border-color: var(--danger); }
    .field .clear {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border: 0; border-radius: 50%; cursor: pointer;
      background: transparent; color: var(--muted); font-size: 18px; line-height: 1;
      display: none; align-items: center; justify-content: center;
    }
    .field .clear:hover { background: var(--line); color: var(--text); }
    .field.has-value .clear { display: inline-flex; }

    .msg { min-height: 22px; margin: 8px 0 0; font-size: .875rem; color: var(--muted); }
    .msg.error { color: var(--danger); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 50px; padding: 0 22px;
      font: inherit; font-weight: 600; font-size: 1rem;
      color: #fff; background: var(--accent);
      border: 0; border-radius: var(--radius-sm); cursor: pointer;
      transition: background .15s, transform .1s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(.985); }
    .btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .btn[disabled] { opacity: .6; cursor: progress; }
    .btn.primary { width: 100%; margin-top: 12px; }
    .btn.ghost { color: var(--accent-text); background: var(--accent-soft); }
    .btn.ghost:hover { background: var(--line); }
    .btn.small { height: 38px; padding: 0 14px; font-size: .9rem; }

    .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Security check, shown inline only when the server demands it */
    .check {
      margin-top: 16px; padding: 16px;
      border: 1px dashed var(--line); border-radius: var(--radius-sm);
      background: var(--field);
      animation: rise .3s ease both;
    }
    .check p { margin: 0 0 12px; font-size: .9rem; color: var(--muted); }
    .check .widget { display: flex; justify-content: center; min-height: 65px; }

    /* Result */
    .result {
      margin-top: 20px; padding: 18px;
      border-radius: var(--radius-sm);
      background: var(--ok-soft);
      border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
      animation: rise .35s cubic-bezier(.2, .8, .2, 1) both;
    }
    .result .title { display: flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ok); margin-bottom: 8px; }
    .result .short {
      display: block; font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em;
      color: var(--text); text-decoration: none; word-break: break-all;
    }
    .result .short:hover { text-decoration: underline; }
    .result .long { margin: 4px 0 14px; font-size: .85rem; color: var(--muted); word-break: break-all; }
    .result .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    /* Recent links */
    .recent { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
    .recent .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .recent h2 { margin: 0; font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .recent .head button { border: 0; background: none; color: var(--muted); font: inherit; font-size: .8rem; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
    .recent .head button:hover { color: var(--danger); background: var(--danger-soft); }
    .recent ul { list-style: none; margin: 0; padding: 0; }
    .recent li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .recent li:last-child { border-bottom: 0; }
    .recent .text { flex: 1; min-width: 0; }
    .recent .text a { display: block; font-weight: 600; text-decoration: none; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent .text a:hover { color: var(--accent-text); }
    .recent .text span { display: block; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent .copy {
      flex: none; height: 34px; padding: 0 12px; font: inherit; font-size: .85rem; font-weight: 600;
      color: var(--accent-text); background: var(--accent-soft); border: 0; border-radius: 8px; cursor: pointer;
    }
    .recent .copy:hover { background: var(--line); }

    footer { margin-top: 28px; text-align: center; font-size: .85rem; color: var(--muted); }
    footer a { color: inherit; }
    footer .dot { margin: 0 8px; opacity: .5; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media (max-width: 480px) {
      body { padding-top: 32px; }
      .result .actions .btn { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="/" aria-label="Tyrion home">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="var(--accent)"/>
          <path d="M11 13.5a4.5 4.5 0 0 1 4.5-4.5h1a4.5 4.5 0 0 1 0 9h-1" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M21 18.5a4.5 4.5 0 0 1-4.5 4.5h-1a4.5 4.5 0 0 1 0-9h1" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        Tyrion
      </a>
      <p class="tagline">Short links that keep your referrer to yourself.</p>
    </header>

    <main class="card">
      <form id="form" novalidate>
        <label for="url">Paste a long link</label>
        <div class="field" id="field">
          <input id="url" name="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="https://example.com/a/very/long/address" aria-describedby="msg" autofocus>
          <button type="button" class="clear" id="clear" aria-label="Clear">&times;</button>
        </div>
        <p class="msg" id="msg" aria-live="polite"></p>

        <div class="check" id="check" hidden>
          <p id="checkText">One quick check before we create your link.</p>
          <div class="widget" id="turnstileBox"></div>
        </div>

        <button type="submit" class="btn primary" id="submit">
          <span id="submitLabel">Shorten</span>
        </button>
      </form>

      <section class="result" id="result" hidden aria-live="polite">
        <div class="title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Your short link
        </div>
        <a class="short" id="shortLink" href="#" target="_blank" rel="noopener"></a>
        <div class="long" id="longLink"></div>
        <div class="actions">
          <button type="button" class="btn small" id="copy">Copy link</button>
          <a class="btn small ghost" id="open" href="#" target="_blank" rel="noopener">Open</a>
          <button type="button" class="btn small ghost" id="another">Shorten another</button>
        </div>
      </section>

      <section class="recent" id="recent" hidden>
        <div class="head">
          <h2>Recent links</h2>
          <button type="button" id="clearRecent">Clear</button>
        </div>
        <ul id="recentList"></ul>
      </section>
    </main>

    <footer>
      <a href="https://github.com/Jeffreyhung/tyrion/blob/main/docs/API.md">API</a>
      <span class="dot">&middot;</span>
      <a href="https://github.com/Jeffreyhung/tyrion">Source</a>
      <span class="dot">&middot;</span>
      <span>Links redirect without a referrer</span>
    </footer>
  </div>

  <script>
    // Public Turnstile site key, injected by the worker when serving this page.
    const TURNSTILE_SITE_KEY = "{{TURNSTILE_SITE_KEY}}";
    const TURNSTILE_SCRIPT = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    const RECENT_KEY = "tyrion:recent";
    const RECENT_MAX = 8;

    const $ = (id) => document.getElementById(id);
    const el = {
      form: $("form"), field: $("field"), input: $("url"), clear: $("clear"), msg: $("msg"),
      check: $("check"), checkText: $("checkText"), turnstile: $("turnstileBox"),
      submit: $("submit"), submitLabel: $("submitLabel"),
      result: $("result"), shortLink: $("shortLink"), longLink: $("longLink"), copy: $("copy"), open: $("open"), another: $("another"),
      recent: $("recent"), recentList: $("recentList"), clearRecent: $("clearRecent"),
    };

    const state = { busy: false, token: null, widgetId: null, pendingUrl: null, short: null };

    // ---- helpers ------------------------------------------------------------

    function normalise(raw) {
      let v = raw.trim();
      if (!v) return "";
      // "example.com/page" is almost always meant as https://example.com/page
      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v) && /^[\w-]+(\.[\w-]+)+/.test(v)) v = "https://" + v;
      return v;
    }

    function isValid(v) {
      try {
        const u = new URL(v);
        return (u.protocol === "http:" || u.protocol === "https:") && u.hostname.includes(".");
      } catch { return false; }
    }

    function setMessage(text, isError) {
      el.msg.textContent = text || "";
      el.msg.classList.toggle("error", Boolean(isError));
      el.input.setAttribute("aria-invalid", isError ? "true" : "false");
    }

    function setBusy(busy) {
      state.busy = busy;
      el.submit.disabled = busy;
      el.submitLabel.textContent = busy ? "Shortening" : "Shorten";
      if (busy) {
        const s = document.createElement("span"); s.className = "spinner"; s.id = "spin";
        el.submit.prepend(s);
      } else {
        const s = $("spin"); if (s) s.remove();
      }
    }

    async function copyText(text, button, label) {
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
        else {
          const ta = document.createElement("textarea");
          ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
        }
        const original = button.textContent;
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = label || original; }, 1600);
      } catch {
        setMessage("Could not copy automatically. Select the link and copy it manually.", true);
      }
    }

    // ---- recent links (per browser, best effort) ------------------------------

    function loadRecent() {
      try { const v = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); return Array.isArray(v) ? v : []; }
      catch { return []; }
    }
    function saveRecent(items) {
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(items.slice(0, RECENT_MAX))); } catch {}
    }
    function remember(short, long) {
      const items = loadRecent().filter((i) => i.short !== short);
      items.unshift({ short, long, at: Date.now() });
      saveRecent(items);
      renderRecent();
    }
    function renderRecent() {
      const items = loadRecent();
      el.recent.hidden = items.length === 0;
      el.recentList.replaceChildren(...items.map((item) => {
        const li = document.createElement("li");
        const text = document.createElement("div"); text.className = "text";
        const a = document.createElement("a"); a.href = item.short; a.textContent = item.short.replace(/^https?:\/\//, ""); a.target = "_blank"; a.rel = "noopener";
        const span = document.createElement("span"); span.textContent = item.long;
        text.append(a, span);
        const copy = document.createElement("button"); copy.type = "button"; copy.className = "copy"; copy.textContent = "Copy";
        copy.addEventListener("click", () => copyText(item.short, copy, "Copy"));
        li.append(text, copy);
        return li;
      }));
    }

    // ---- Turnstile, loaded only when the server asks for a check ----------------

    function loadTurnstile() {
      return new Promise((resolve, reject) => {
        if (window.turnstile && typeof window.turnstile.render === "function") return resolve();
        const s = document.createElement("script");
        s.src = TURNSTILE_SCRIPT; s.async = true;
        s.onload = resolve; s.onerror = () => reject(new Error("The verification widget could not be loaded."));
        document.head.appendChild(s);
      });
    }

    async function requestCheck(url) {
      if (!TURNSTILE_SITE_KEY) {
        setMessage("A verification is required but this server has not configured it.", true);
        return;
      }
      state.pendingUrl = url;
      el.check.hidden = false;
      el.checkText.textContent = "This looks unusual, so we need one quick check before creating your link.";
      try { await loadTurnstile(); }
      catch (e) { el.check.hidden = true; setMessage(e.message, true); return; }
      if (state.widgetId !== null) { turnstile.reset(state.widgetId); return; }
      state.widgetId = turnstile.render(el.turnstile, {
        sitekey: TURNSTILE_SITE_KEY,
        callback: (token) => {
          state.token = token;
          el.check.hidden = true;
          const pending = state.pendingUrl; state.pendingUrl = null;
          if (pending) shorten(pending);
        },
        "error-callback": () => setMessage("Verification failed. Please try again.", true),
        "expired-callback": () => { state.token = null; },
      });
    }

    // ---- main flow -------------------------------------------------------------

    async function shorten(url) {
      if (state.busy) return;
      setBusy(true);
      setMessage("");
      try {
        const body = state.token ? { url, captcha_token: state.token } : { url };
        const res = await fetch("/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        state.token = null;

        if (data.status === 200) {
          showResult(location.origin + data.key, url);
        } else if (data.captcha_required) {
          await requestCheck(url);
        } else {
          setMessage(data.error || "Something went wrong. Please try again.", true);
        }
      } catch {
        setMessage("Network error. Check your connection and try again.", true);
      } finally {
        setBusy(false);
      }
    }

    function showResult(short, long) {
      state.short = short;
      el.shortLink.href = short; el.shortLink.textContent = short.replace(/^https?:\/\//, "");
      el.open.href = short;
      el.longLink.textContent = long;
      el.result.hidden = false;
      el.input.value = ""; el.field.classList.remove("has-value");
      remember(short, long);
      el.copy.focus();
    }

    el.form.addEventListener("submit", (e) => {
      e.preventDefault();
      const url = normalise(el.input.value);
      if (!url) { setMessage("Paste a link to shorten.", true); el.input.focus(); return; }
      if (!isValid(url)) { setMessage("That does not look like a web address. It should start with http:// or https://.", true); el.input.focus(); return; }
      el.input.value = url;
      el.result.hidden = true;
      shorten(url);
    });

    el.input.addEventListener("input", () => {
      el.field.classList.toggle("has-value", el.input.value.length > 0);
      if (el.msg.classList.contains("error")) setMessage("");
    });
    el.clear.addEventListener("click", () => { el.input.value = ""; el.field.classList.remove("has-value"); setMessage(""); el.input.focus(); });
    el.copy.addEventListener("click", () => copyText(state.short, el.copy, "Copy link"));
    el.another.addEventListener("click", () => { el.result.hidden = true; el.input.focus(); });
    el.clearRecent.addEventListener("click", () => { saveRecent([]); renderRecent(); });

    // Paste-and-go: pasting into the empty field submits straight away.
    el.input.addEventListener("paste", () => {
      if (el.input.value) return;
      setTimeout(() => { if (isValid(normalise(el.input.value))) el.form.requestSubmit(); }, 0);
    });

    renderRecent();
  </script>
</body>
</html>
