name = "tyrion"
main = "index.js"
compatibility_date = "2025-09-01"

# Homepage and other static files are served from ./public through env.ASSETS.
# run_worker_first keeps the worker in charge of routing (short keys never
# collide with asset paths, and POST / still reaches the API).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Required: the KV namespace that stores short links.
# Create it with `npx wrangler kv namespace create LINKS` and paste the id here.
[[kv_namespaces]]
binding = "LINKS"
id = "a695fd1c03574330a8046686a81de0cb"

# Optional but recommended: soft limit on link creation per client IP. Going
# over it does not block the request, it marks it "suspicious" so the visitor
# has to pass a Turnstile challenge. See
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "CHALLENGE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Optional: hard cap on link creation per client IP (HTTP 429 when exceeded).
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1002"
# simple = { limit = 30, period = 60 }

# Non-secret settings. Every value has a sensible default in index.js; only set
# what you want to change. Booleans are the strings "true" / "false".
[vars]
NO_REF = "true"
CORS = "true"
UNIQUE_LINK = "true"
FORWARD_QUERY_PARAMS = "true"
EXPIRATION_TTL = "0"
MAX_URL_LENGTH = "2048"

# Turnstile site key (public). Create a widget at
# https://dash.cloudflare.com/?to=/:account/turnstile with your shortener's
# hostname, then paste its site key here. The matching secret key is set with
# `npx wrangler secret put TURNSTILE_SECRET_KEY`.
TURNSTILE_SITE_KEY = "0x4AAAAAAEv0Z59ZnojRrNoE"

# When to demand a Turnstile challenge: "off", "suspicious" or "always".
CHALLENGE_ON_CREATE = "suspicious"
CHALLENGE_ON_ACCESS = "off"
# Risk score (see assessRisk in index.js) at which a request is "suspicious".
SUSPICION_THRESHOLD = "3"
CHALLENGE_TIMEOUT = "5000"
CHALLENGE_MAX_RETRIES = "2"
CHALLENGE_FALLBACK_ON_ERROR_CREATE = "false"
CHALLENGE_FALLBACK_ON_ERROR_ACCESS = "true"

# Secrets are never stored here. Set them with:
#   npx wrangler secret put TURNSTILE_SECRET_KEY
#   npx wrangler secret put SAFE_BROWSING_API_KEY   (optional)
#   npx wrangler secret put API_TOKEN               (optional, lets scripts skip the challenge)
#
# For local development put Cloudflare's always-passing test keys in .dev.vars
# (git-ignored):
#   TURNSTILE_SITE_KEY=1x00000000000000000000AA
#   TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
